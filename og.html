<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Big+Shoulders+Display:wght@800;900&family=Montserrat:wght@900&display=swap">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#090C0B;font-family:Archivo,sans-serif;color:#F0ECE0;position:relative}
.bg{position:absolute;inset:auto 0 0 0;height:260px;background:repeating-linear-gradient(0deg,#1A452B 0 52px,#173D26 52px 104px)}
.bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(240,236,224,.25) 0 3px,transparent 3px 104px)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(#090C0B,rgba(9,12,11,0) 70%)}
.ltg{position:absolute;left:0;right:0;bottom:120px;height:6px;background:#F2D33B;box-shadow:0 0 18px rgba(242,211,59,.6)}
.wrap{position:relative;display:grid;grid-template-columns:440px 1fr;align-items:center;height:100%;padding:0 70px;gap:50px}
.logo{width:420px}.logo .the{font:900 30px Montserrat;letter-spacing:.32em}.logo .num{font:900 176px Montserrat;letter-spacing:-2px}
h1{font:900 92px/.92 'Big Shoulders Display';margin:0 0 18px;text-transform:uppercase}
h1 b{color:#F2D33B;font-weight:900}
p{font-size:27px;color:#B9BEB9;margin:0;line-height:1.35}
</style></head><body><div class="bg"></div><div class="ltg"></div>
<div class="wrap"><div><svg class="logo" viewBox="0 0 320 200" role="img" aria-label="THE 53">
    <defs>
      <linearGradient id="LG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFF1C2"/><stop offset=".42" stop-color="#E7B955"/>
        <stop offset=".58" stop-color="#B88528"/><stop offset="1" stop-color="#F0CC72"/>
      </linearGradient>
    </defs>
    <text class="the" x="160" y="30" text-anchor="middle" fill="url(#LG)">THE</text>
    <text class="num" x="160" y="186" text-anchor="middle" fill="url(#LG)" stroke="#3A2A08" stroke-width="3" paint-order="stroke">53</text>
    <g transform="translate(160 122) rotate(-24)">
      <ellipse rx="64" ry="31" fill="#07090F"/>
      <ellipse rx="56" ry="25" fill="url(#LG)" stroke="#3A2A08" stroke-width="3"/>
      <path d="M-46 -5 Q0 -22 46 -5 M-46 5 Q0 22 46 5" fill="none" stroke="#3A2A08" stroke-width="2" opacity=".55"/>
      <g stroke="#2A1D05" stroke-linecap="round"><line x1="-22" y1="0" x2="22" y2="0" stroke-width="4"/>
        <line x1="-15" y1="-7" x2="-15" y2="7" stroke-width="4"/><line x1="-5" y1="-7" x2="-5" y2="7" stroke-width="4"/>
        <line x1="5" y1="-7" x2="5" y2="7" stroke-width="4"/><line x1="15" y1="-7" x2="15" y2="7" stroke-width="4"/></g>
    </g>
  </svg></div><div><h1>One team.<br>One clock.<br><b>Name 53.</b></h1><p>The NFL roster game. Deep cuts buy time.</p></div></div>
</body></html>
