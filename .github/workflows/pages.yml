# Copies dist/ to the gh-pages branch on every push to main. GitHub Pages serves that branch.
# One-time setup: repo Settings > Pages > Source: "Deploy from a branch", Branch: gh-pages, folder: / (root).
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push dist/ to gh-pages
        run: |
          cd dist
          rm -f the53-single.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
